# Pedagogical report glossary — English.
#
# Definitions for the non-expert reader, shown at the end of the report for the
# metrics the engine actually computes. DATA (not executable surface): an entry
# is added only for a metric that has a real consumer (a score in RunResult).
#
# Per-entry fields:
#   title       : short title (shown in the disclosure summary)
#   definition  : 2-3 sentences of formal definition
#   measures    : what the metric concretely measures
#   limits      : known limits and common pitfalls
#   oracle      : the named reference, and what the computation is checked against
#
# Category and unit are NOT here: they are declared in the registry
# (MetricSpec), and the card reads them there. The definition names the
# unit the computation's statistic counts (locked by a test).

cer:
  title: "CER — character error rate"
  definition: >-
    Edit distance (substitutions + insertions + deletions) between the
    output and the reference, counted in characters (Unicode code
    points), relative to the number of reference characters. Both texts
    are first prepared by the view's profile (default flat_text: NFC,
    invisible characters removed, every whitespace run reduced to one
    space). 0 = perfect transcription; above 1 if the output gets
    longer. The per-line CER applies the same formula to each line,
    capped at 1.
  measures: >-
    Character-by-character fidelity between the engine output and the ground
    truth, under the view's convention.
  limits: >-
    Blind to error meaning: a mistake on a rare character weighs as much as a
    common one. Depends on the profile: under keep_line_breaks ("text
    (lines)" view), a line break rendered as a space counts as one
    substitution; flat, it does not.
  oracle: >-
    Reference: the CER of ISRI (ocreval), jiwer and dinglehopper.
    Checked against: jiwer 4.0.0 (cer), recomputed in CI, and
    dinglehopper 0.11.0, run in CI (oracle job) on ten convention cases
    and on the 150 pairs of bnl_mini, "text (lines)" view: each gap is
    named (repeated spaces; the ’/' apostrophe and dashes of its SBB
    table) and together they give dinglehopper's figure exactly.

cer_diplo:
  title: "Diplomatic CER"
  definition: >-
    Character error rate (CER) computed after the view's profile and
    then a minimal folding applied to both sides: NFC Unicode form,
    invisible characters removed, long s ſ folded to s. Other historical
    variants (u/v, ligatures) remain distinct.
  measures: >-
    Fidelity to the witness's spelling, without penalising the ſ/s choice
    alone or a Unicode encoding difference invisible to the eye.
  limits: >-
    Less strict than CER, not more. Under the default profile, which
    already applies NFC and removes invisible characters, the gap between
    the two isolates the ſ effect; under a raw comparison it mixes in those
    two effects. Comparable only across engines evaluated on the same ground
    truth.
  oracle: >-
    Reference: the CER, after folding ſ → s (diplomatic transcription).
    Variant: the folding is Cinoc's. Checked against: values worked out
    by hand in the tests.

wer:
  title: "WER — word error rate"
  definition: >-
    The word-level counterpart of CER: edit distance between the word
    sequences of hypothesis and reference, divided by the reference word
    count.
  measures: >-
    Word-by-word fidelity; a word is wrong as soon as a single character
    differs.
  limits: >-
    Very sensitive to word segmentation and attached punctuation; a high WER
    can hide a low CER.
  oracle: >-
    Reference: jiwer's WER (word-level edit distance, words split on
    whitespace). Checked against: jiwer 4.0.0 (wer), recomputed in CI;
    compared with dinglehopper 0.11.0 (oracle job, bnl_mini), whose WER
    has another definition — UAX #29 words, punctuation dropped.

mer:
  title: "MER — match error rate"
  definition: >-
    At word level: (S+D+I)/(H+S+D+I), the ratio of edit operations to the
    length of the word alignment, bounded between 0 and 1.
  measures: >-
    The fraction of the word-to-word alignment that is not an exact match; a
    bounded variant of WER.
  limits: >-
    Close to WER on clean text; diverges mainly with long insertions. For
    its character variant, see cMER.
  oracle: >-
    Reference: the MER of Morris, Maier and Green (2004), as jiwer
    computes it. Checked against: jiwer 4.0.0 (mer), recomputed in CI.

cmer:
  title: "cMER — character match error rate (HIPE)"
  definition: >-
    Character-level Match Error Rate — (S+D+I)/(H+S+D+I) —, bounded between
    0 and 1. The ranking metric of the HIPE-OCRepair benchmark; it matches
    the official scorer only in a view using the "hipe" profile — otherwise
    it is computed under the view's own profile.
  measures: >-
    The fraction of the character alignment that is not an exact match.
    Unlike CER (relative to the reference only), it stays comparable even
    when a generative model lengthens the text (CER > 100%).
  limits: >-
    Depends on the normalization profile: the "hipe" profile folds case,
    punctuation and some heritage forms (œ/oe, æ/ae) — compare the
    hipe/heritage views to isolate that effect.
  oracle: >-
    Reference: the ranking metric of the HIPE-OCRepair scorer. Checked
    against: the official scorer (values pinned at 1e-9) and
    jiwer.process_characters.

numseq_strict:
  title: "Numerical sequences — strict preservation"
  definition: >-
    Share of the ground truth's numerical sequences (years, foliation,
    amounts, regnal years) reproduced in their exact form by the engine.
    Not applicable when the GT carries none.
  measures: >-
    The survival of what a historian cites and searches: "1515", "fol. 12r",
    "3 livres", "an III" — form included.
  limits: >-
    Conservative pattern detection: spelled-out forms ("mil cinq cens") are
    not covered; precision is favoured over recall.
  oracle: >-
    Reference: none — a Cinoc construction. Checked against: values
    worked out by hand in the tests.

numseq_value:
  title: "Numerical sequences — value preservation"
  definition: >-
    Share of the ground truth's numerical sequences whose equivalent is
    reproduced, in any form: "f. 12r" matches "fol. 12r", "an 3" matches
    "an III", "3 l." matches "3 livres".
  measures: >-
    The survival of the numerical information itself, tolerant to
    abbreviation and form conversion.
  limits: >-
    Always greater than or equal to strict preservation; a large gap between
    the two flags an engine that modernises or abbreviates forms.
  oracle: >-
    Reference: none — a Cinoc construction. Checked against: values
    worked out by hand in the tests.

del_rate:
  title: "Deletion rate"
  definition: >-
    Share of reference words missing from the hypothesis (deletions of the
    word alignment), relative to the number of reference words.
  measures: >-
    The engine's tendency to "drop" text (under-transcription).
  limits: >-
    A single error component: read together with the insertion rate to
    diagnose an imbalance.
  oracle: >-
    Reference: the share of word deletions, as sclite (NIST) reports it.
    Variant: how a tied alignment splits S/D/I is Cinoc's. Checked
    against: values worked out by hand in the tests.

ins_rate:
  title: "Insertion rate"
  definition: >-
    Number of hypothesis words with no counterpart in the reference
    (insertions of the word alignment), relative to the number of reference
    words.
  measures: >-
    The engine's tendency to "invent" text (over-transcription, sometimes a
    sign of LLM hallucination).
  limits: >-
    A single error component; a high rate in isolation points to noise or
    hallucination rather than a misreading.
  oracle: >-
    Reference: the share of word insertions, as sclite (NIST) reports
    it. Variant: how a tied alignment splits S/D/I is Cinoc's. Checked
    against: values worked out by hand in the tests.

diacritic_err:
  title: "Diacritic error"
  definition: >-
    Among reference characters carrying a diacritic (accent, cedilla,
    breve…), the share substituted or deleted in the hypothesis. The whole
    character is judged: é read as è counts as an error.
  measures: >-
    The engine's fidelity to accentuation, often lost by OCR trained on
    modern text.
  limits: >-
    Not applicable to scripts without diacritics. Sensitive to Unicode form:
    without a normalization profile, a precomposed é against the same
    decomposed é counts as an error.
  oracle: >-
    Reference: none — a Cinoc construction. Checked against: values
    worked out by hand in the tests.

mufi_err:
  title: "MUFI error (medieval characters)"
  definition: >-
    Error rate restricted to characters from the Medieval Unicode Font
    Initiative (abbreviations, rare letters) present in the reference.
  measures: >-
    The engine's ability to render the specialized characters of medieval
    scripts.
  limits: >-
    Not applicable if the ground truth contains no MUFI character.
  oracle: >-
    Reference: none — a Cinoc construction (MUFI standardises
    characters, not a metric). Checked against: values worked out by
    hand in the tests.

hcpr:
  title: "Historical character preservation (HCPR)"
  definition: >-
    Share of archaic characters from a configured list (long s, rotunda
    abbreviations, thorn…) present in the ground truth that survive in the output.
  measures: >-
    The engine's *diplomatic* fidelity to historical forms — the "preservation"
    counterpart of mufi_err/diacritic_err, over a curated list.
  limits: >-
    Shown only when an archaic list is explicitly configured (otherwise
    redundant with mufi_err); not applicable if the GT carries none.
  oracle: >-
    Reference: none — a Cinoc construction. Checked against: values
    worked out by hand in the tests.

air:
  title: "Archaism insertion rate (AIR)"
  definition: >-
    Share of archaic characters in the **output** that are inserted — at a
    position not faithful to the ground truth — rather than copied from it.
  measures: >-
    Over-historicization: a VLM/LLM that "archaizes" text the GT writes plainly
    (added long s, invented abbreviations).
  limits: >-
    Not applicable if the output contains no character from the list; an upper
    bound (a legitimate archaism outside the GT can raise it).
  oracle: >-
    Reference: none — a Cinoc construction. Checked against: values
    worked out by hand in the tests.

ner_f1:
  title: "Named-entity F1 (span)"
  definition: >-
    Harmonic mean of precision/recall over entities (people, places, dates)
    recovered in the output: an output entity counts if its span, projected
    into ground-truth coordinates, overlaps that of an entity with the same
    label at IoU ≥ 0.5. The written form is not compared.
  measures: >-
    Downstream usefulness for prosopographic indexing: a flattering CER can
    hide the loss of proper nouns, which are decisive for search.
  limits: >-
    Joint OCR + NER measure (the entity model also fails). The IoU ≥ 0.5
    threshold is Cinoc's own convention, more tolerant than exact-span
    matching and stricter than mere overlap: "Montfort" read "Montfert" in
    the same place counts as correct — that is what ner_f1_exact measures.
  oracle: >-
    Reference: the entity F1 of NER evaluation campaigns, which match
    spans exactly (strict) or by any overlap (fuzzy). Variant: matching
    at IoU ≥ 0.5 is Cinoc's own. Checked
    against: values worked out by hand in the tests.

ner_f1_exact:
  title: "Named-entity F1 (exact name)"
  definition: >-
    Like ner_f1, but a matched entity only counts as correct if its written
    form in the output is identical, character for character, to the ground
    truth's; otherwise it counts as both missed and spurious.
  measures: >-
    How many names an index built on the output would find as written —
    "Montfert" for "Montfort" is a lost name.
  limits: >-
    No tolerance: a different case or accent is enough to miss the name.
    Same matching and limits as ner_f1 (joint OCR + NER measure).
  oracle: >-
    Reference: the entity F1 of NER evaluation campaigns. Variant:
    ner_f1's matching (IoU ≥ 0.5), then an exact written form. Checked against: values worked
    out by hand in the tests.

unanchored_trigrams:
  title: "Unanchored text (trigrams)"
  definition: >-
    Share of the hypothesis's character trigrams **absent** from the
    reference (1 − n-gram anchoring). Higher = more text produced with no
    support in the ground truth.
  measures: >-
    How much text is produced with no match in the source document — a
    measured signal, not a "hallucination" detector.
  limits: >-
    It only sees new trigrams: a duplicated page (the output copies the page
    twice) scores 0.021 for a CER of 1.01, and reordered text almost 0. A
    legitimate insertion (text present on the page but outside the ground
    truth) raises it; it establishes no model intent.
  oracle: >-
    Reference: none — a Cinoc construction. Checked against: values
    worked out by hand in the tests. The duplicated page (0.021) is
    pinned there as a limit.

searchability:
  title: "Full-text recall (length-dependent tolerance)"
  definition: >-
    Share of reference words found in the hypothesis by a tolerant search:
    Levenshtein distance at most 0 for a 1- or 2-character word, 1 for 3 to
    5, 2 beyond (Lucene/Elasticsearch AUTO scale); multiset matching.
  measures: >-
    How many GT words would remain retrievable by a tolerant search despite
    transcription errors.
  limits: >-
    A usage heuristic: it does not replace a recall evaluation on real
    queries. A transposition costs 2 edits (Lucene counts it as 1).
  oracle: >-
    Reference: Lucene/Elasticsearch fuzzy search (fuzziness AUTO).
    Variant: Levenshtein distance (Lucene counts a transposition as 1).
    Not executed in the tests; checked against: values worked out by
    hand in the tests.

region_cer:
  title: "Per-region CER"
  definition: >-
    CER aggregated over layout regions (block, column), when segmentation
    provides a partition: Σ errors / Σ reference characters, regions matched
    by identifier, otherwise by geometry. A reference region with no
    counterpart counts all its text as deletions; a **phantom** region (in
    the output, with no counterpart) counts all of its own as insertions.
  measures: >-
    Localized transcription quality, to spot the areas of a page where the
    engine breaks down.
  limits: >-
    Depends on upstream segmentation quality; not applicable without a
    structural layer. Exceeds 1 when the output invents more text than the
    reference holds.
  oracle: >-
    Reference: the CER, per matched region. Variant: matching by
    identifier, else by geometry, phantom regions counted as insertions
    — Cinoc's own. Checked against: values worked out by hand in the
    tests.

fca:
  title: "FCA — flexible accuracy (limited: merged lines → 0)"
  definition: >-
    Character accuracy (1 − errors / reference characters, bounded to
    [0, 1]) after optimal matching of **lines**, in any order: text
    transcribed in another reading order is not penalised.
  measures: >-
    Transcription quality regardless of line order (swapped columns,
    reordered blocks).
  limits: >-
    A simplified variant of Clausner et al. (2019): a line is only matched
    whole, never split. Under a profile that keeps lines, as soon as the
    output merges them — the typical case of a VLM returning a paragraph —
    every reference line stays unmatched and FCA is **0**, whatever the
    quality of the text (raw CER 0.105 on an example where it is 0). Under
    the default profile (flat_text), the view has already joined the lines:
    only one is left, and FCA equals 1 − CER, without its order tolerance.
    No default view scores it: a spec that keeps lines asks for it.
  oracle: >-
    Reference: the Flexible Character Accuracy of Clausner et al.
    Variant: lines matched whole (Hungarian algorithm), never split. The
    reference package is not executed; checked against: values worked
    out by hand in the tests.

region_detection:
  title: "Region detection"
  definition: >-
    Region F1: a detected region and a layout ground-truth region are
    matched (greedily, each at most once) when the IoU of their bounding
    boxes, in page-relative coordinates, reaches 0.5; precision =
    matched / detected regions, recall = matched / reference regions.
  measures: >-
    The accuracy of segmentation (did we find the right blocks, in the right
    place) independently of text.
  limits: >-
    Not applicable without layout ground truth; sensitive to the chosen
    overlap threshold.
  oracle: >-
    Reference: detection F1 at IoU ≥ 0.5 (PASCAL VOC convention).
    Variant: greedy matching of bounding boxes in relative coordinates.
    Checked against: values worked out by hand in the tests. Plus a real
    ABBYY excerpt (BnL).

significance_p:
  title: "p-value (statistical test)"
  definition: >-
    Probability of observing gaps at least as large between the pipelines
    if they were in fact equivalent (null hypothesis) — Wilcoxon signed-rank
    for 2 pipelines, Friedman for 3 or more, over the documents scored for
    all of them.
  measures: >-
    How surprising a performance gap is. The test result (exploratory)
    rests on the p-value corrected by Holm over all the run's computed
    tests, compared with the reference threshold α = 0.05.
  limits: >-
    Measures neither the magnitude nor the practical importance of the gap;
    sensitive to corpus size. A Friedman test says at least one pipeline
    differs: which ones, only the Nemenyi post-hoc says.
  oracle: >-
    Reference: scipy's Wilcoxon signed-rank and Friedman tests. Checked
    against: 5,005 randomly drawn tests, recomputed without Cinoc's code
    (test, p, Holm correction, post-hoc).

ece:
  title: "ECE — expected calibration error"
  definition: >-
    Token-weighted average gap between the confidence an engine reports and
    its actually observed accuracy.
  measures: >-
    How trustworthy an engine's confidence scores are: a well-calibrated
    engine is right as often as it claims.
  limits: >-
    Measures the confidences of the step the view scores (an OCR's
    confidences say nothing of the text an LLM corrected after it); not
    applicable to a step without confidence scores. Depends on the binning:
    ten bins [b/10, (b+1)/10), the last one closed at 1.0.
  oracle: >-
    Reference: the ten-bin ECE of Guo et al. (2017). Checked against:
    values worked out by hand in the tests.

mce:
  title: "MCE — maximum calibration error"
  definition: >-
    Largest gap, across all confidence bins, between reported confidence and
    observed accuracy.
  measures: >-
    The worst case of an engine's over- or under-confidence, where ECE only
    gives the average.
  limits: >-
    Sensitive to sparsely populated bins; read together with ECE.
  oracle: >-
    Reference: the ten-bin MCE of Guo et al. (2017). Checked against:
    values worked out by hand in the tests.

char_accuracy:
  title: "Character accuracy"
  definition: >-
    1 − CER, bounded to [0, 1]: the share of reference characters the
    output renders, under the view's profile.
  measures: >-
    The same character-by-character fidelity as CER, read 'higher is
    better'.
  limits: >-
    Redundant with CER, which it copies up to the bound: an output long
    enough to push CER above 1 scores 0 — the report then writes the
    untruncated error rate and its counts beside it. On the corpus, the
    bound applies to the summed counts, never to an average of per-page
    bounds.
  oracle: >-
    Reference: ISRI character accuracy, (n − errors) / n. Variant:
    bounded at 0 by Cinoc. Checked against: the CER, itself checked
    against jiwer.

word_accuracy:
  title: "Word accuracy"
  definition: >-
    1 − WER, bounded to [0, 1]: computed from the word-level edit
    distance, relative to the number of reference words.
  measures: >-
    WER's word-by-word fidelity, read 'higher is better'.
  limits: >-
    Redundant with WER, up to the bound. It is not ISRI word accuracy,
    which counts correctly recognised words.
  oracle: >-
    Reference: word accuracy (ISRI, ICDAR). Variant: bounded 1 − WER,
    Cinoc's own. Checked against: the WER, itself checked against jiwer.

bow_precision:
  title: "Bag of words — precision"
  definition: >-
    Share of output words that are correct, regardless of order: Σ
    min(reference count, output count) over distinct words, divided by
    the number of output words.
  measures: >-
    What a full-text search would find exact in the output: a verbose
    output loses precision.
  limits: >-
    Words split on whitespace, attached punctuation included; blind to
    order (shuffled text scores 1).
  oracle: >-
    Reference: bag-of-words precision (information retrieval). Variant:
    whitespace splitting, Cinoc's own. Checked against: values worked
    out by hand in the tests.

bow_recall:
  title: "Bag of words — recall"
  definition: >-
    Share of reference words found in the output, regardless of order: Σ
    min(reference count, output count) over distinct words, divided by
    the number of reference words.
  measures: >-
    What an exact full-text search would retrieve of the document.
  limits: >-
    Words split on whitespace; blind to order. One wrong letter loses
    the word (see searchability for a tolerant search).
  oracle: >-
    Reference: bag-of-words recall (information retrieval). Variant:
    whitespace splitting, Cinoc's own. Checked against: values worked
    out by hand in the tests.

bow_f1:
  title: "Bag of words — F1"
  definition: >-
    Harmonic mean of bag-of-words precision and recall,
    2·tp / (2·tp + fp + fn) in words; on the corpus, the F1 of the summed
    word counts, not an average of per-document F1.
  measures: >-
    The balance between correct words produced and expected words
    retrieved, regardless of order.
  limits: >-
    Blind to order: a moved word costs nothing here, where WER counts it
    twice.
  oracle: >-
    Reference: bag-of-words F1 (information retrieval). Variant:
    whitespace splitting, Cinoc's own. Checked against: values worked
    out by hand in the tests.

line_identity_cer:
  title: "Per-line CER (matched by identifier)"
  definition: >-
    Edit distance of lines matched by their identifier, relative to the
    number of reference characters of those lines; a reference line
    missing from the output counts as entirely wrong.
  measures: >-
    Line-by-line transcription quality when the pairing is known,
    without a line alignment's guesswork.
  limits: >-
    Not applicable if one side carries no line identifier; a line
    without an identifier is ignored. Read with the coverage.
  oracle: >-
    Reference: the CER, on lines matched by identity. Checked against:
    values worked out by hand in the tests.

line_identity_coverage:
  title: "Line coverage (by identifier)"
  definition: >-
    Share of reference lines the output carries under the same
    identifier.
  measures: >-
    Lines lost, merged or renamed — invisible in a CER, which cannot
    tell a vanished line from a misread one.
  limits: >-
    A plain count: a line present but wrong counts as found.
  oracle: >-
    Reference: none — a Cinoc construction. Checked against: values
    worked out by hand in the tests.

reading_order_tau:
  title: "Reading-order disagreement"
  definition: >-
    Normalised Kendall distance between reading orders: share of the
    pairs of blocks (regions) present on both sides that the output
    places in the reverse order of the reference; on the corpus, summed
    discordant pairs of regions over summed pairs.
  measures: >-
    Ordering alone, which the CER confuses with reading.
  limits: >-
    Only looks at common regions: read with the order coverage, or two
    well-ordered regions out of thirty look excellent.
  oracle: >-
    Reference: Kendall distance (1938). Variant: restricted to matched
    regions, Cinoc's own. Checked against: values worked out by hand in
    the tests.

reading_order_coverage:
  title: "Reading-order coverage"
  definition: >-
    Share of the regions of the reference reading order that the output
    has ordered.
  measures: >-
    The mandatory companion of the order disagreement: how many regions
    it could judge.
  limits: >-
    A plain count, which says nothing of the order's correctness.
  oracle: >-
    Reference: none — a Cinoc construction. Checked against: values
    worked out by hand in the tests.
