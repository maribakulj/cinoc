# Glossaire pédagogique du rapport — français.
#
# Définitions destinées au lecteur non-expert, affichées en fin de rapport
# pour les seules métriques effectivement calculées par le moteur. DONNÉE
# (≠ surface exécutable) : on n'ajoute une entrée que pour une métrique qui a
# un consommateur réel (un détecteur/un score dans le RunResult).
#
# Champs par entrée :
#   title       : titre court (affiché dans le résumé dépliable)
#   definition  : 2-3 phrases de définition formelle
#   measures    : ce que la métrique mesure concrètement
#   limits      : limites connues, pièges fréquents

cer:
  title: "CER — taux d'erreur caractère"
  definition: >-
    Distance d'édition (substitutions + insertions + suppressions) entre la
    sortie et la référence, comptée en points de code Unicode, rapportée à
    la longueur de la référence. Les deux textes sont d'abord préparés par le
    profil de la vue (défaut flat_text : NFC, invisibles retirés, tout blanc
    réduit à une espace). 0 = transcription parfaite ; dépasse 1 si la sortie
    rallonge. Le CER par ligne applique la même formule à chaque ligne,
    plafonnée à 1.
  measures: >-
    La fidélité caractère-à-caractère entre la sortie du moteur et la
    vérité terrain, sous la convention de la vue.
  limits: >-
    Insensible au sens des erreurs : une faute sur un caractère rare pèse
    autant qu'une faute courante. Dépend du profil : sous keep_line_breaks
    (vue « texte (lignes) »), un saut de ligne rendu par une espace compte
    une substitution ; à plat, non.

cer_diplo:
  title: "CER diplomatique"
  definition: >-
    CER calculé après le profil de la vue puis un repli minimal appliqué des
    deux côtés : forme Unicode NFC, invisibles retirés, s long ſ replié en s.
    Les autres variantes historiques (u/v, ligatures) restent distinctes.
  measures: >-
    La fidélité à la graphie du témoin, sans pénaliser le seul choix ſ/s
    ni une différence d'encodage Unicode invisible à l'œil.
  limits: >-
    Moins sévère que le CER, pas plus. Sous le profil par défaut, qui
    applique déjà NFC et retire les invisibles, l'écart entre les deux isole
    l'effet ſ ; sous une comparaison brute, il y mêle ces deux effets. À ne
    comparer qu'entre moteurs évalués sur la même vérité terrain.

wer:
  title: "WER — taux d'erreur mot"
  definition: >-
    Équivalent du CER au niveau du mot : distance d'édition entre les
    suites de mots de l'hypothèse et de la référence, rapportée au nombre
    de mots de référence.
  measures: >-
    La fidélité mot-à-mot ; un mot est faux dès qu'un seul de ses
    caractères diffère.
  limits: >-
    Très sensible à la segmentation en mots et à la ponctuation collée ;
    un WER élevé peut masquer un CER faible.

mer:
  title: "MER — match error rate"
  definition: >-
    Au niveau du mot : (S+D+I)/(H+S+D+I), rapport entre les opérations
    d'édition et la longueur de l'alignement des mots, borné entre 0 et 1.
  measures: >-
    La part de l'alignement mot-à-mot qui n'est pas une correspondance
    exacte ; variante bornée du WER.
  limits: >-
    Proche du WER sur texte propre ; diverge surtout en présence de longues
    insertions. Pour sa variante caractère, voir le cMER.

cmer:
  title: "cMER — match error rate caractère (HIPE)"
  definition: >-
    Match Error Rate au niveau caractère — (S+D+I)/(H+S+D+I) —, borné entre
    0 et 1. C'est la métrique de classement du benchmark HIPE-OCRepair ;
    elle n'est conforme au scorer officiel que dans une vue au profil
    « hipe » — sinon elle est calculée sous le profil de la vue.
  measures: >-
    La part de l'alignement caractère qui n'est pas une correspondance
    exacte. Contrairement au CER (rapporté à la seule référence), il reste
    comparable même quand un modèle génératif rallonge le texte (CER > 100 %).
  limits: >-
    Dépend du profil de normalisation : le profil « hipe » plie casse,
    ponctuation et certaines formes patrimoniales (œ/oe, æ/ae) — comparer les
    vues hipe/heritage pour isoler cet effet.

numseq_strict:
  title: "Séquences numériques — restitution stricte"
  definition: >-
    Part des séquences numériques de la vérité terrain (années, foliotation,
    montants, années régnales) restituées sous leur forme exacte par le
    moteur. Non applicable si la GT n'en porte aucune.
  measures: >-
    La survie de ce qu'un historien cite et cherche : « 1515 », « fol. 12r »,
    « 3 livres », « an III » — à la forme près.
  limits: >-
    Détection par motifs conservateurs : les formes en toutes lettres
    (« mil cinq cens ») ne sont pas couvertes ; la précision prime sur le
    rappel.

numseq_value:
  title: "Séquences numériques — restitution en valeur"
  definition: >-
    Part des séquences numériques de la vérité terrain dont l'équivalent est
    restitué, quelle que soit la forme : « f. 12r » vaut « fol. 12r »,
    « an 3 » vaut « an III », « 3 l. » vaut « 3 livres ».
  measures: >-
    La survie de l'information numérique elle-même, tolérante aux
    abréviations et conversions de forme.
  limits: >-
    Toujours supérieure ou égale à la restitution stricte ; un écart fort
    entre les deux signale un moteur qui modernise ou abrège les formes.

del_rate:
  title: "Taux de suppressions"
  definition: >-
    Part des mots de la référence absents de l'hypothèse (suppressions de
    l'alignement au mot), rapportée au nombre de mots de référence.
  measures: >-
    La tendance du moteur à « oublier » du texte (sous-transcription).
  limits: >-
    Composante d'erreur seule : à lire avec le taux d'insertions pour
    diagnostiquer un déséquilibre.

ins_rate:
  title: "Taux d'insertions"
  definition: >-
    Nombre de mots de l'hypothèse sans correspondant dans la référence
    (insertions de l'alignement au mot), rapporté au nombre de mots de
    référence.
  measures: >-
    La tendance du moteur à « inventer » du texte (sur-transcription,
    parfois signe d'hallucination LLM).
  limits: >-
    Composante d'erreur seule ; un taux élevé isolé oriente vers du bruit
    ou une hallucination plutôt qu'une mauvaise lecture.

diacritic_err:
  title: "Erreur sur les diacritiques"
  definition: >-
    Parmi les caractères de la référence qui portent un signe diacritique
    (accent, cédille, brève…), part substituée ou supprimée dans
    l'hypothèse. C'est le caractère entier qui est jugé : é lu è compte
    comme une erreur.
  measures: >-
    La fidélité du moteur à l'accentuation, souvent perdue par les OCR
    entraînés sur du texte moderne.
  limits: >-
    Non applicable aux écritures sans diacritiques. Sensible à la forme
    Unicode : sans profil de normalisation, un é composé face au même é
    décomposé compte comme une erreur.

mufi_err:
  title: "Erreur MUFI (caractères médiévaux)"
  definition: >-
    Taux d'erreur restreint aux caractères de la Medieval Unicode Font
    Initiative (abréviations, lettres rares) présents dans la référence.
  measures: >-
    La capacité du moteur à restituer les caractères spécialisés des
    écritures médiévales.
  limits: >-
    Non applicable si la vérité terrain ne contient aucun caractère MUFI.

hcpr:
  title: "Préservation des archaïsmes (HCPR)"
  definition: >-
    Part des caractères archaïques d'une liste configurée (s long, abréviations
    rotunda, thorn…) présents dans la vérité terrain qui survivent dans la sortie.
  measures: >-
    La fidélité *diplomatique* du moteur aux formes historiques — le pendant
    « préservation » de mufi_err/diacritic_err, sur une liste curée.
  limits: >-
    Visible seulement quand une liste archaïque est explicitement configurée
    (sinon redondant avec mufi_err) ; non applicable si la GT n'en porte aucun.

air:
  title: "Apport net d'archaïsmes (AIR)"
  definition: >-
    Part des caractères archaïques de la **sortie** qui sont insérés — à une
    position non fidèle à la vérité terrain — plutôt que recopiés d'elle.
  measures: >-
    La **sur-historicisation** : un VLM/LLM qui « archaïse » un texte que la GT
    écrit en clair (s long ajouté, abréviations inventées).
  limits: >-
    Non applicable si la sortie ne contient aucun caractère de la liste ;
    borne supérieure (un archaïsme légitime hors GT peut le faire monter).

ner_f1:
  title: "F1 sur entités nommées"
  definition: >-
    Moyenne harmonique précision/rappel des entités (personnes, lieux, dates)
    retrouvées dans la sortie, spans alignés en coordonnées vérité terrain.
  measures: >-
    L'**utilité aval** pour l'indexation prosopographique : un CER flatteur
    peut masquer la perte des noms propres, décisifs pour la recherche.
  limits: >-
    Mesure **conjointe** OCR + extracteur NER (le modèle d'entités faillit
    aussi) ; appariement par recouvrement de spans (IoU ≥ 0,5), pas par sens.

hallucination:
  title: "Texte non ancré (trigrammes)"
  definition: >-
    Part des trigrammes de caractères de l'hypothèse **absents** de la
    référence (1 − ancrage n-gramme). Plus haut = plus de texte produit
    sans appui dans le GT.
  measures: >-
    La quantité de texte produit sans correspondance dans le document
    source — un signal mesuré, pas une preuve d'« hallucination »
    intentionnelle.
  limits: >-
    Mesure de surface : une insertion légitime (texte réellement présent
    mais hors GT) la fait monter ; n'établit aucune intention du modèle.

searchability:
  title: "Rappel plein-texte (Lev ≤ 2)"
  definition: >-
    Part des mots de la référence retrouvés dans l'hypothèse à distance de
    Levenshtein ≤ 2 (recherche plein-texte tolérante, appariement
    multi-ensemble).
  measures: >-
    Combien de mots du GT resteraient retrouvables par une recherche
    tolérante malgré les erreurs de transcription.
  limits: >-
    Heuristique d'usage : ne remplace pas une évaluation de rappel sur des
    requêtes réelles.

region_cer:
  title: "CER par région"
  definition: >-
    CER agrégé au niveau d'une région de mise en page (bloc, colonne),
    quand la segmentation fournit un découpage.
  measures: >-
    La qualité de transcription localisée, pour repérer les zones d'une
    page où le moteur décroche.
  limits: >-
    Dépend de la qualité de la segmentation amont ; non applicable sans
    couche structurelle.

region_detection:
  title: "Détection de régions"
  definition: >-
    Mesure de recouvrement entre les régions détectées par la segmentation
    et les régions de la vérité terrain de mise en page.
  measures: >-
    La justesse de la segmentation (a-t-on trouvé les bons blocs, au bon
    endroit) indépendamment du texte.
  limits: >-
    Non applicable sans vérité terrain de mise en page ; sensible au seuil
    de recouvrement choisi.

significance_p:
  title: "p-valeur (test statistique)"
  definition: >-
    Probabilité d'observer des écarts au moins aussi grands entre les
    pipelines s'ils étaient en réalité équivalents (hypothèse nulle) —
    Wilcoxon signé-rangs à 2 pipelines, Friedman à 3 et plus, sur les
    documents notés chez tous.
  measures: >-
    Le degré de surprise d'un écart de performance ; le verdict lit la
    p-valeur corrigée de Holm sur tous les tests du run, sous α = 0,05.
  limits: >-
    Ne mesure ni l'ampleur ni l'importance pratique de l'écart ; sensible à
    la taille du corpus. Un Friedman dit qu'au moins un pipeline diffère :
    lesquels, seul le post-hoc de Nemenyi le dit.

ece:
  title: "ECE — erreur de calibration attendue"
  definition: >-
    Écart moyen, pondéré par le nombre de jetons, entre la confiance
    annoncée par le moteur et son exactitude réellement observée.
  measures: >-
    À quel point les scores de confiance d'un moteur sont fiables : un
    moteur bien calibré a raison à hauteur de ce qu'il annonce.
  limits: >-
    Mesure les confiances de l'étape que la vue note (celles d'un OCR ne
    disent rien du texte qu'un LLM a corrigé derrière lui) ; non applicable
    à une étape sans score de confiance. Dépend du découpage : dix bins
    [b/10 ; (b+1)/10[, le dernier fermé à 1,0.

mce:
  title: "MCE — erreur de calibration maximale"
  definition: >-
    Plus grand écart, sur l'ensemble des bins de confiance, entre confiance
    annoncée et exactitude observée.
  measures: >-
    Le pire cas de sur- ou sous-confiance d'un moteur, là où l'ECE n'en
    donne que la moyenne.
  limits: >-
    Sensible aux bins peu peuplés ; à lire conjointement avec l'ECE.
