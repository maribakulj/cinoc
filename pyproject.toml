[build-system]
requires = ["setuptools>=68", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "cinoc"
description = "Banc d'essai déterministe de pipelines de transcription (OCR / HTR / VLM)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dynamic = ["version"]
dependencies = [
    "pydantic>=2",
    "lxml>=5",
    "pyyaml>=6",
    "scipy>=1.11",
    "rapidfuzz>=3",
    # Transport HTTP unique (importeurs de corpus, OCR cloud REST, ollama,
    # segmenteur distant). En base : la CLI importe les importeurs au
    # demarrage, et `pip install cinoc` sans extra plantait sur `cinoc --help`.
    "httpx",
    "httpcore",
    # numpy est une dépendance directe de evaluation/ (jusqu'ici tirée via scipy).
    # Plafond <2.5 : numpy 2.5 (Python >=3.12 uniquement) livre des stubs en
    # syntaxe PEP 695 `type X = ...` que mypy, ciblant python_version 3.11, refuse
    # de parser. À relever quand l'interaction mypy/numpy est résolue en amont.
    "numpy<2.5",
]

[project.optional-dependencies]
dev = [
    "ruff", "mypy", "pytest", "pytest-cov", "pytest-xdist", "lxml-stubs",
    "types-PyYAML", "jiwer", "fastapi", "jinja2",
    "python-multipart", "Pillow",
]
tesseract = ["pytesseract"]
kraken = ["kraken"]
pero = ["pero-ocr"]  # OCR/HTR local (imprimé ancien + manuscrit) — non déployé au Space
calamari = ["calamari-ocr"]  # OCR local par ligne — non déployé au Space
# SDK des moteurs distants : épinglés par **majeure**. Une majeure change l'API
# du client (mistralai 2.x a déplacé `Mistral` vers `mistralai.client`, et seule
# la 3.x demande et décode les blocs de Mistral OCR) : la relever, c'est migrer
# l'adaptateur et rejouer `tests/adapters/test_native_json_real_sdk.py` contre
# la roue PyPI. Le même épinglage vaut dans `deploy/requirements.txt`.
openai = ["openai>=3,<4"]
anthropic = ["anthropic>=2,<3"]
mistral = ["mistralai>=3,<4"]
# Post-correction structuree (LAYOUT -> LAYOUT) : corrige dans la mise en
# page au lieu d'aplatir avant de corriger.
# Version exacte : celle verifiee avec le pont de correction (suite complete
# rejouee contre la roue PyPI). La relever = rejouer les tests du pont.
saknussemm = [
    "saknussemm==0.9.0",
]
huggingface = ["datasets", "huggingface_hub"]  # datasets = streaming ; huggingface_hub = publication (scripts/) + snapshot dataset curé (import_curated_hf_corpus)
segment = ["paddlex"]
# Segmenteur de mise en page installable **entièrement par pip** (poids tirés du
# Hub au premier run) : le seul qui rende la famille hybride exécutable sans
# PaddleX ni endpoint distant.
yolo = ["doclayout-yolo", "huggingface_hub"]
# Scoreur de qualité D'AlemBERT (routage sélectif de la post-correction).
# Plafond `transformers<5` : le dépôt `pjox/dalembert` ne publie que des poids
# `pytorch_model.bin`, et transformers 5 ne les charge plus. À relever le jour
# où le modèle publiera des safetensors — pas avant, sinon le scoreur ne charge
# plus du tout.
qe = ["torch", "transformers<5"]
ner = ["spacy"]  # extraction d'entités nommées — modèle téléchargé à part (`spacy download`)
serve = ["fastapi", "uvicorn", "jinja2", "python-multipart"]
images = ["Pillow"]  # vignettes réelles du rapport (redimensionnement) — dégradé gracieux sans
# Oracle de conformité HIPE (golden test, jamais en runtime — SPEC_HIPE §5).
# Extra DÉDIÉ (pas dans dev) : le scorer exige Python >= 3.12, l'inclure dans
# dev casserait l'installation 3.11. Aucun job CI ne l'installe : le golden
# HIPE est vendorisé, l'extra sert à le régénérer en local.
hipe-oracle = ["hipe-ocrepair-scorer==0.9.9"]
# Oracles de test EXÉCUTÉS (P5e 10, D-290 ; jamais en runtime) : le paquet
# `roman` et dinglehopper, installés par le seul job CI `oracle` — les tests
# marqués `oracle` sautent ailleurs. dinglehopper 0.11.0 et ocrd 3.13.3 s'y
# installent À PART, en `--no-deps` (une extra ne sait pas le dire) :
# dinglehopper déclare `ocrd>=3.3`, qui tire tout OCR-D (fastapi, docker,
# paramiko, opencv…), alors que les modules utilisés n'en importent que
# `ocrd_utils`. Ci-dessous, exactement ce qu'exige l'import de
# `dinglehopper.ocr_files`, `.character_error_rate` et `.word_error_rate`,
# relevé dans un venv vierge (lxml, numpy, rapidfuzz : base ; Pillow : dev).
# Relever une version = régénérer le golden (`tests/evaluation/
# test_dinglehopper_golden.py`), qui écrit la version de l'oracle qui l'a produit.
oracle = [
    "roman==5.2",
    "uniseg==0.10.1",
    "multimethod==1.12",
    "attrs==26.1.0",
    "chardet==7.7.0",
    "frozendict==2.5.1",
    "filetype==1.2.0",
    "atomicwrites==1.4.1",
    "Deprecated==1.2.0",
    "wrapt==1.17.3",
]

[project.scripts]
cinoc = "cinoc.interfaces.cli:main"

[tool.setuptools.packages.find]
include = ["cinoc*"]

# La coquille web embarque ses gabarits + assets auto-hébergés (CSS, polices) ;
# ils doivent voyager dans le wheel pour exister après ``pip install`` (Space/CI).
[tool.setuptools.package-data]
"cinoc.interfaces.web" = [
    "templates/*.html", "static/css/*.css", "static/js/*.js", "static/fonts/*",
]
# Le rapport autonome (couche 7) incorpore ses polices (data-URI) et son script
# de comparaison (inliné) : woff2 + compare.js doivent voyager dans le wheel.
"cinoc.reports" = ["_assets/*.woff2", "_assets/*.js"]
# Glossaire pédagogique (donnée FR/EN) — doit voyager dans le wheel.
"cinoc.reports.glossary" = ["*.yaml"]
# Table de tarifs (donnée datée) du calcul économique (couche 3).
"cinoc.evaluation" = ["pricing.json"]
# Prompts curés par période (donnée LLM/VLM) — doivent voyager dans le wheel.
"cinoc.prompts" = ["*.txt"]
# Recettes de pipeline (donnée, comme les profils et les prompts) : une forme
# nommée par son intention, choisie plutôt que composée.
"cinoc.recipes" = ["*.yaml"]

# Les ``.md`` sous ``cinoc/`` sont des notes de conception (analyses de couche,
# plans) : setuptools_scm les ferait entrer dans la roue comme données du
# paquet, alors qu'aucun code ne les lit (P5d item 5, D-270). Le sdist, lui,
# les garde : ce sont des sources. Les exclusions du sdist sont dans MANIFEST.in.
[tool.setuptools.exclude-package-data]
"*" = ["*.md"]

[tool.setuptools_scm]
fallback_version = "0.1.0"
version_file = "cinoc/_version.py"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = false
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# Coverage = concern du GATE, pas de la boucle locale : pas dans addopts (sinon
# chaque `pytest`, même un sous-ensemble, paierait ×3,4 le tracing). Elle est
# injectée explicitement par `make cov`/`make ci` et la CI (cf. Makefile/ci.yml).
markers = [
    "slow: tests lents (opt-in)",
    "network: tests qui touchent le réseau (opt-in)",
    "live: tests contre une vraie API/binaire (opt-in)",
    "oracle: tests contre un outil de référence exécuté (dinglehopper, roman) — job CI `oracle`, extra `oracle`",
]
filterwarnings = [
    # `starlette.testclient` (versions 2026) émet une dépréciation httpx→httpx2
    # à l'IMPORT — purement côté tests (la prod sert via uvicorn, sans TestClient).
    # Dette amont, hors de notre code ; filtrée pour garder la sortie propre.
    "ignore:Using .httpx. with .starlette.testclient.:Warning",
]

[tool.coverage.run]
omit = ["*/_version.py"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "^\\s*\\.\\.\\.$",
    "^\\s*\\.\\.\\.\\s*#",
]
