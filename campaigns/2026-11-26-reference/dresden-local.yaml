pipelines:
- name: E0 · tesseract
  description: OCR seul (Tesseract Fraktur ; aucun modèle Kurrent).
  initial_inputs:
  - image
  steps:
  - id: lecture
    kind: ocr
    adapter_name: tesseract:lecture
    input_types:
    - image
    output_types:
    - raw_text
    inputs_from:
      image: __initial__
- name: E1 · segmentation → tesseract
  description: Segmentation Tesseract, OCR par région.
  initial_inputs:
  - image
  steps:
  - id: seg
    kind: segmenter
    adapter_name: tesseract_layout:seg
    input_types:
    - image
    output_types:
    - layout
    inputs_from:
      image: __initial__
  - id: reco
    kind: region_recognizer
    adapter_name: tesseract:reco
    input_types:
    - layout
    - image
    output_types:
    - layout
    inputs_from:
      layout: seg
      image: __initial__
    fanout: true
    crop: true
  - id: lecture
    kind: projection
    adapter_name: layout_to_text:lecture
    input_types:
    - layout
    output_types:
    - raw_text
    inputs_from:
      layout: reco
- name: E3 · segmentation → tesseract → saknussemm (règles)
  description: 'Validation de chaîne sans clé : correction structurée par règles.'
  initial_inputs:
  - image
  steps:
  - id: seg
    kind: segmenter
    adapter_name: tesseract_layout:seg
    input_types:
    - image
    output_types:
    - layout
    inputs_from:
      image: __initial__
  - id: reco
    kind: region_recognizer
    adapter_name: tesseract:reco
    input_types:
    - layout
    - image
    output_types:
    - layout
    inputs_from:
      layout: seg
      image: __initial__
    fanout: true
    crop: true
  - id: lecture
    kind: projection
    adapter_name: layout_to_text:lecture
    input_types:
    - layout
    output_types:
    - raw_text
    inputs_from:
      layout: reco
  - id: correction
    kind: structured_correction
    adapter_name: saknussemm:regles
    input_types:
    - layout
    output_types:
    - layout
    - corrected_text
    - decisions
    inputs_from:
      layout: reco
- name: E5 · qwen2.5vl:3b (local)
  description: VLM local zero-shot, prompt générique (déclaré au README).
  initial_inputs:
  - image
  steps:
  - id: lecture
    kind: zero_shot
    adapter_name: ollama:qwen_vlm
    input_types:
    - image
    output_types:
    - raw_text
    inputs_from:
      image: __initial__
- name: E2 · tesseract → qwen2.5:3b (local)
  description: OCR Tesseract puis correction LLM locale (texte), prompt générique.
  initial_inputs:
  - image
  steps:
  - id: lecture
    kind: ocr
    adapter_name: tesseract:lecture
    input_types:
    - image
    output_types:
    - raw_text
    inputs_from:
      image: __initial__
  - id: correction
    kind: correction
    adapter_name: ollama:qwen_correction
    input_types:
    - raw_text
    output_types:
    - corrected_text
    inputs_from:
      raw_text: lecture
evaluation:
  views:
  - name: texte
    description: 'Défaut (flat_text) : la sortie la plus aval de chaque chaîne. cer_diplo = convention
      BNL ſ = s (repli des deux côtés).'
    candidate_types:
    - raw_text
    - corrected_text
    normalization_profile: flat_text
    metric_names:
    - cer
    - wer
    - cer_diplo
    - cmer
    - mer
    - unanchored_trigrams
  - name: texte (lignes)
    description: 'Défaut (keep_line_breaks) : sauts de ligne comptés — le chiffre comparable à dinglehopper.'
    candidate_types:
    - raw_text
    - corrected_text
    normalization_profile: keep_line_breaks
    metric_names:
    - cer
  - name: lecture
    description: 'Ablation : l''étape « lecture » de chaque chaîne, avant toute correction (E0/E1 dans
      les chaînes E2/E3/E4).'
    candidate_types:
    - raw_text
    normalization_profile: flat_text
    target_step: lecture
    metric_names:
    - cer
    - wer
    - cer_diplo
  - name: sans césure
    description: 'Convention ⸗ : un mot coupé en fin de ligne (⸗, -, ‐, ‑, –, ¬ + saut) est recollé des
      deux côtés ; sauts de ligne comptés comme dans « texte (lignes) ».'
    candidate_types:
    - raw_text
    - corrected_text
    normalization_profile: dehyphenated
    metric_names:
    - cer
adapter_kwargs:
  tesseract:lecture:
    label: lecture
    lang: Fraktur
  tesseract_layout:seg:
    label: seg
    lang: Fraktur
  tesseract:reco:
    label: reco
    lang: Fraktur
  layout_to_text:lecture:
    label: lecture
  saknussemm:regles:
    label: regles
    producer: rules
  ollama:qwen_vlm:
    label: qwen_vlm
    model: qwen2.5vl:3b
    host: http://127.0.0.1:11434
    role: zero_shot
    max_tokens: 2048
  ollama:qwen_correction:
    label: qwen_correction
    model: qwen2.5:3b
    host: http://127.0.0.1:11434
    role: text_only
    max_tokens: 2048
    temperature: 0
    seed: 0
    timeout: 900
