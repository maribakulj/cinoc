run_id: reference-bnl-local-saknussemm
corpus:
  name: 37-GT-BNL
  documents:
  - id: '0000'
    image_uri: 0000.png
    ground_truths:
    - type: raw_text
      uri: 0000.gt.txt
    metadata:
      gt_source: layout
  - id: 0009
    image_uri: 0009.png
    ground_truths:
    - type: raw_text
      uri: 0009.gt.txt
    metadata:
      gt_source: layout
  - id: '0017'
    image_uri: 0017.png
    ground_truths:
    - type: raw_text
      uri: 0017.gt.txt
    metadata:
      gt_source: layout
  - id: '0025'
    image_uri: 0025.png
    ground_truths:
    - type: raw_text
      uri: 0025.gt.txt
    metadata:
      gt_source: layout
  - id: '0033'
    image_uri: 0033.png
    ground_truths:
    - type: raw_text
      uri: 0033.gt.txt
    metadata:
      gt_source: layout
pipelines:
- name: E0 · tesseract
  description: OCR seul (Tesseract Fraktur+fra).
  initial_inputs:
  - image
  steps:
  - id: lecture
    kind: ocr
    adapter_name: tesseract:lecture
    input_types:
    - image
    output_types:
    - raw_text
    inputs_from:
      image: __initial__
- name: E1 · segmentation → tesseract
  description: Segmentation Tesseract, OCR par région.
  initial_inputs:
  - image
  steps:
  - id: seg
    kind: segmenter
    adapter_name: tesseract_layout:seg
    input_types:
    - image
    output_types:
    - layout
    inputs_from:
      image: __initial__
  - id: reco
    kind: region_recognizer
    adapter_name: tesseract:reco
    input_types:
    - layout
    - image
    output_types:
    - layout
    inputs_from:
      layout: seg
      image: __initial__
    fanout: true
    crop: true
  - id: lecture
    kind: projection
    adapter_name: layout_to_text:lecture
    input_types:
    - layout
    output_types:
    - raw_text
    inputs_from:
      layout: reco
- name: E3 · segmentation → tesseract → saknussemm (règles)
  description: 'Validation de chaîne sans clé : correction structurée par règles.'
  initial_inputs:
  - image
  steps:
  - id: seg
    kind: segmenter
    adapter_name: tesseract_layout:seg
    input_types:
    - image
    output_types:
    - layout
    inputs_from:
      image: __initial__
  - id: reco
    kind: region_recognizer
    adapter_name: tesseract:reco
    input_types:
    - layout
    - image
    output_types:
    - layout
    inputs_from:
      layout: seg
      image: __initial__
    fanout: true
    crop: true
  - id: lecture
    kind: projection
    adapter_name: layout_to_text:lecture
    input_types:
    - layout
    output_types:
    - raw_text
    inputs_from:
      layout: reco
  - id: correction
    kind: structured_correction
    adapter_name: saknussemm:regles
    input_types:
    - layout
    output_types:
    - layout
    - corrected_text
    - decisions
    inputs_from:
      layout: reco
- name: E4 · segmentation → tesseract → saknussemm sélectif (règles, QE heuristique)
  description: 'Validation de chaîne sans clé : routage QE (heuristique de saknussemm, AUC 0,5) puis règles.'
  initial_inputs:
  - image
  steps:
  - id: seg
    kind: segmenter
    adapter_name: tesseract_layout:seg
    input_types:
    - image
    output_types:
    - layout
    inputs_from:
      image: __initial__
  - id: reco
    kind: region_recognizer
    adapter_name: tesseract:reco
    input_types:
    - layout
    - image
    output_types:
    - layout
    inputs_from:
      layout: seg
      image: __initial__
    fanout: true
    crop: true
  - id: lecture
    kind: projection
    adapter_name: layout_to_text:lecture
    input_types:
    - layout
    output_types:
    - raw_text
    inputs_from:
      layout: reco
  - id: correction
    kind: structured_correction
    adapter_name: saknussemm:regles_qe
    input_types:
    - layout
    output_types:
    - layout
    - corrected_text
    - decisions
    inputs_from:
      layout: reco
- name: E5 · qwen2.5vl:3b (local)
  description: VLM local zero-shot, prompt générique (déclaré au README).
  initial_inputs:
  - image
  steps:
  - id: lecture
    kind: zero_shot
    adapter_name: ollama:qwen_vlm
    input_types:
    - image
    output_types:
    - raw_text
    inputs_from:
      image: __initial__
- name: E2 · tesseract → qwen2.5:3b (local)
  description: OCR Tesseract puis correction LLM locale (texte), prompt curé de correction presse XIXᵉ.
  initial_inputs:
  - image
  steps:
  - id: lecture
    kind: ocr
    adapter_name: tesseract:lecture
    input_types:
    - image
    output_types:
    - raw_text
    inputs_from:
      image: __initial__
  - id: correction
    kind: correction
    adapter_name: ollama:qwen_correction
    input_types:
    - raw_text
    output_types:
    - corrected_text
    inputs_from:
      raw_text: lecture
- name: E1 · segmentation → qwen2.5vl:3b (VLM par région, local)
  description: Segmentation Tesseract, chaque région lue par le VLM local.
  initial_inputs:
  - image
  steps:
  - id: seg
    kind: segmenter
    adapter_name: tesseract_layout:seg
    input_types:
    - image
    output_types:
    - layout
    inputs_from:
      image: __initial__
  - id: reco
    kind: region_recognizer
    adapter_name: ollama:qwen_reco
    input_types:
    - layout
    - image
    output_types:
    - layout
    inputs_from:
      layout: seg
      image: __initial__
    fanout: true
    crop: true
  - id: lecture
    kind: projection
    adapter_name: layout_to_text:lecture
    input_types:
    - layout
    output_types:
    - raw_text
    inputs_from:
      layout: reco
- name: E3 · segmentation → tesseract → saknussemm (qwen2.5:3b, local)
  description: Correction structurée intégrale par le LLM local.
  initial_inputs:
  - image
  steps:
  - id: seg
    kind: segmenter
    adapter_name: tesseract_layout:seg
    input_types:
    - image
    output_types:
    - layout
    inputs_from:
      image: __initial__
  - id: reco
    kind: region_recognizer
    adapter_name: tesseract:reco
    input_types:
    - layout
    - image
    output_types:
    - layout
    inputs_from:
      layout: seg
      image: __initial__
    fanout: true
    crop: true
  - id: lecture
    kind: projection
    adapter_name: layout_to_text:lecture
    input_types:
    - layout
    output_types:
    - raw_text
    inputs_from:
      layout: reco
  - id: correction
    kind: structured_correction
    adapter_name: saknussemm:qwen
    input_types:
    - layout
    output_types:
    - layout
    - corrected_text
    - decisions
    - native_json
    inputs_from:
      layout: reco
- name: E4 · segmentation → tesseract → saknussemm sélectif (qwen2.5:3b, QE dalembert, local)
  description: 'Correction structurée sélective : seules les lignes au-dessus du seuil QE partent au LLM
    local.'
  initial_inputs:
  - image
  steps:
  - id: seg
    kind: segmenter
    adapter_name: tesseract_layout:seg
    input_types:
    - image
    output_types:
    - layout
    inputs_from:
      image: __initial__
  - id: reco
    kind: region_recognizer
    adapter_name: tesseract:reco
    input_types:
    - layout
    - image
    output_types:
    - layout
    inputs_from:
      layout: seg
      image: __initial__
    fanout: true
    crop: true
  - id: lecture
    kind: projection
    adapter_name: layout_to_text:lecture
    input_types:
    - layout
    output_types:
    - raw_text
    inputs_from:
      layout: reco
  - id: correction
    kind: structured_correction
    adapter_name: saknussemm:qwen_qe
    input_types:
    - layout
    output_types:
    - layout
    - corrected_text
    - decisions
    - native_json
    inputs_from:
      layout: reco
evaluation:
  views:
  - name: texte
    description: 'Défaut (flat_text) : la sortie la plus aval de chaque chaîne. cer_diplo = convention
      BNL ſ = s (repli des deux côtés).'
    candidate_types:
    - raw_text
    - corrected_text
    normalization_profile: flat_text
    metric_names:
    - cer
    - wer
    - cer_diplo
    - cmer
    - mer
    - unanchored_trigrams
  - name: texte (lignes)
    description: 'Défaut (keep_line_breaks) : sauts de ligne comptés — le chiffre comparable à dinglehopper.'
    candidate_types:
    - raw_text
    - corrected_text
    normalization_profile: keep_line_breaks
    metric_names:
    - cer
  - name: lecture
    description: 'Ablation : l''étape « lecture » de chaque chaîne, avant toute correction (E0/E1 dans
      les chaînes E2/E3/E4).'
    candidate_types:
    - raw_text
    normalization_profile: flat_text
    target_step: lecture
    metric_names:
    - cer
    - wer
    - cer_diplo
  - name: sans césure
    description: 'Convention ⸗ : un mot coupé en fin de ligne (⸗, -, ‐, ‑, –, ¬ + saut) est recollé des
      deux côtés ; sauts de ligne comptés comme dans « texte (lignes) ».'
    candidate_types:
    - raw_text
    - corrected_text
    normalization_profile: dehyphenated
    metric_names:
    - cer
adapter_kwargs:
  tesseract:lecture:
    label: lecture
    lang: Fraktur+fra
  tesseract_layout:seg:
    label: seg
    lang: Fraktur+fra
  tesseract:reco:
    label: reco
    lang: Fraktur+fra
  layout_to_text:lecture:
    label: lecture
  saknussemm:regles:
    label: regles
    producer: rules
  saknussemm:regles_qe:
    label: regles_qe
    producer: rules
    qe: heuristic
    qe_skip: 0.5
  ollama:qwen_vlm:
    label: qwen_vlm
    model: qwen2.5vl:3b
    host: http://127.0.0.1:11434
    role: zero_shot
    max_tokens: 2048
  ollama:qwen_correction:
    label: qwen_correction
    model: qwen2.5:3b
    host: http://127.0.0.1:11434
    role: text_only
    max_tokens: 2048
    temperature: 0
    seed: 0
    timeout: 900
    prompt_name: correction_press_19c_european
  ollama:qwen_reco:
    label: qwen_reco
    model: qwen2.5vl:3b
    host: http://127.0.0.1:11434
    role: zero_shot
    max_tokens: 1024
    temperature: 0
    seed: 0
    timeout: 900
  saknussemm:qwen:
    label: qwen
    producer: ollama
    model: qwen2.5:3b
    host: http://127.0.0.1:11434
    timeout: 1800
  saknussemm:qwen_qe:
    label: qwen_qe
    producer: ollama
    model: qwen2.5:3b
    host: http://127.0.0.1:11434
    qe: dalembert
    qe_skip: 0.5
    timeout: 1800
