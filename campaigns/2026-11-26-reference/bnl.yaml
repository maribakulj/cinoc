pipelines:
- name: E0 · tesseract
  description: OCR seul (Tesseract Fraktur+fra).
  initial_inputs:
  - image
  steps:
  - id: lecture
    kind: ocr
    adapter_name: tesseract:lecture
    input_types:
    - image
    output_types:
    - raw_text
    inputs_from:
      image: __initial__
- name: E1 · segmentation → tesseract
  description: Segmentation Tesseract, OCR par région.
  initial_inputs:
  - image
  steps:
  - id: seg
    kind: segmenter
    adapter_name: tesseract_layout:seg
    input_types:
    - image
    output_types:
    - layout
    inputs_from:
      image: __initial__
  - id: reco
    kind: region_recognizer
    adapter_name: tesseract:reco
    input_types:
    - layout
    - image
    output_types:
    - layout
    inputs_from:
      layout: seg
      image: __initial__
    fanout: true
    crop: true
  - id: lecture
    kind: projection
    adapter_name: layout_to_text:lecture
    input_types:
    - layout
    output_types:
    - raw_text
    inputs_from:
      layout: reco
- name: E3 · segmentation → tesseract → saknussemm (règles)
  description: 'Validation de chaîne sans clé : correction structurée par règles.'
  initial_inputs:
  - image
  steps:
  - id: seg
    kind: segmenter
    adapter_name: tesseract_layout:seg
    input_types:
    - image
    output_types:
    - layout
    inputs_from:
      image: __initial__
  - id: reco
    kind: region_recognizer
    adapter_name: tesseract:reco
    input_types:
    - layout
    - image
    output_types:
    - layout
    inputs_from:
      layout: seg
      image: __initial__
    fanout: true
    crop: true
  - id: lecture
    kind: projection
    adapter_name: layout_to_text:lecture
    input_types:
    - layout
    output_types:
    - raw_text
    inputs_from:
      layout: reco
  - id: correction
    kind: structured_correction
    adapter_name: saknussemm:regles
    input_types:
    - layout
    output_types:
    - layout
    - corrected_text
    - decisions
    inputs_from:
      layout: reco
- name: E4 · segmentation → tesseract → saknussemm sélectif (règles, QE heuristique)
  description: 'Validation de chaîne sans clé : routage QE (heuristique de saknussemm, AUC 0,5) puis règles.'
  initial_inputs:
  - image
  steps:
