evaluation:
  views:
  - name: texte
    description: 'Défaut (flat_text) : la sortie la plus aval de chaque chaîne. cer_diplo = convention
      BNL ſ = s (repli des deux côtés).'
    candidate_types:
    - raw_text
    - corrected_text
    normalization_profile: flat_text
    metric_names:
    - cer
    - wer
    - cer_diplo
    - cmer
    - mer
    - unanchored_trigrams
  - name: texte (lignes)
    description: 'Défaut (keep_line_breaks) : sauts de ligne comptés — le chiffre comparable à dinglehopper.'
    candidate_types:
    - raw_text
    - corrected_text
    normalization_profile: keep_line_breaks
    metric_names:
    - cer
  - name: lecture
    description: 'Ablation : l''étape « lecture » de chaque chaîne, avant toute correction (E0/E1 dans
      les chaînes E2/E3/E4).'
    candidate_types:
    - raw_text
    normalization_profile: flat_text
    target_step: lecture
    metric_names:
    - cer
    - wer
    - cer_diplo
  - name: sans césure
    description: 'Convention ⸗ : un mot coupé en fin de ligne (⸗, -, ‐, ‑, –, ¬ + saut) est recollé des
      deux côtés ; sauts de ligne comptés comme dans « texte (lignes) ».'
    candidate_types:
    - raw_text
    - corrected_text
    normalization_profile: dehyphenated
    metric_names:
    - cer
adapter_kwargs:
  tesseract:lecture:
    label: lecture
    lang: Fraktur+fra
  tesseract_layout:seg:
    label: seg
    lang: Fraktur+fra
  tesseract:reco:
    label: reco
    lang: Fraktur+fra
  layout_to_text:lecture:
    label: lecture
  saknussemm:regles:
    label: regles
    producer: rules
  saknussemm:regles_qe:
    label: regles_qe
    producer: rules
    qe: heuristic
    qe_skip: 0.5
  ollama:qwen_vlm:
    label: qwen_vlm
    model: qwen2.5vl:3b
    host: http://127.0.0.1:11434
    role: zero_shot
    max_tokens: 2048
  mistral_ocr:lecture:
    label: lecture
    model: mistral-ocr-latest
  mistral:correction:
    label: correction
    model: mistral-small-latest
    role: text_only
    max_tokens: 2048
    prompt_name: correction_press_19c_european
  mistral:reco:
    label: reco
    model: mistral-small-latest
    role: zero_shot
    max_tokens: 1024
  mistral:vlm:
    label: vlm
    model: mistral-small-latest
    role: zero_shot
    max_tokens: 2048
  saknussemm:mistral:
    label: mistral
    producer: mistral
    model: mistral-small-latest
  saknussemm:mistral_qe:
    label: mistral_qe
    producer: mistral
    model: mistral-small-latest
    qe: dalembert
    qe_skip: 0.5
  saknussemm:ministral_8b:
    label: ministral_8b
    producer: mistral
    model: ministral-8b-latest
  saknussemm:ministral_3b:
    label: ministral_3b
    producer: mistral
    model: ministral-3b-latest
