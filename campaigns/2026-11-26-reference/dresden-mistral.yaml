pipelines:
- name: E0 · mistral-ocr
  description: OCR seul (Mistral OCR).
  initial_inputs:
  - image
  steps:
  - id: lecture
    kind: ocr
    adapter_name: mistral_ocr:lecture
    input_types:
    - image
    output_types:
    - raw_text
    inputs_from:
      image: __initial__
- name: E2 · tesseract → mistral
  description: OCR Tesseract puis correction LLM (texte).
  initial_inputs:
  - image
  steps:
  - id: lecture
    kind: ocr
    adapter_name: tesseract:lecture
    input_types:
    - image
    output_types:
    - raw_text
    inputs_from:
      image: __initial__
  - id: correction
    kind: correction
    adapter_name: mistral:correction
    input_types:
    - raw_text
    output_types:
    - corrected_text
    inputs_from:
      raw_text: lecture
- name: E2 · mistral-ocr → mistral
  description: OCR Mistral puis correction LLM (texte).
  initial_inputs:
  - image
  steps:
  - id: lecture
    kind: ocr
    adapter_name: mistral_ocr:lecture
    input_types:
    - image
    output_types:
    - raw_text
    inputs_from:
      image: __initial__
  - id: correction
    kind: correction
    adapter_name: mistral:correction
    input_types:
    - raw_text
    output_types:
    - corrected_text
    inputs_from:
      raw_text: lecture
- name: E1 · segmentation → mistral (VLM par région)
  description: Segmentation Tesseract, chaque région lue par le VLM.
  initial_inputs:
  - image
  steps:
  - id: seg
    kind: segmenter
    adapter_name: tesseract_layout:seg
    input_types:
    - image
    output_types:
    - layout
    inputs_from:
      image: __initial__
  - id: reco
    kind: region_recognizer
    adapter_name: mistral:reco
    input_types:
    - layout
    - image
    output_types:
    - layout
    inputs_from:
      layout: seg
      image: __initial__
    fanout: true
    crop: true
  - id: lecture
    kind: projection
    adapter_name: layout_to_text:lecture
    input_types:
    - layout
    output_types:
    - raw_text
    inputs_from:
      layout: reco
- name: E3 · segmentation → tesseract → saknussemm (mistral)
  description: Correction structurée intégrale, chaque ligne au modèle.
  initial_inputs:
  - image
  steps:
  - id: seg
    kind: segmenter
    adapter_name: tesseract_layout:seg
    input_types:
    - image
    output_types:
    - layout
    inputs_from:
      image: __initial__
  - id: reco
    kind: region_recognizer
    adapter_name: tesseract:reco
    input_types:
    - layout
    - image
    output_types:
    - layout
    inputs_from:
      layout: seg
      image: __initial__
    fanout: true
    crop: true
  - id: lecture
    kind: projection
    adapter_name: layout_to_text:lecture
    input_types:
    - layout
    output_types:
    - raw_text
    inputs_from:
      layout: reco
  - id: correction
    kind: structured_correction
    adapter_name: saknussemm:mistral
    input_types:
    - layout
    output_types:
    - layout
    - corrected_text
    - decisions
    - native_json
    inputs_from:
      layout: reco
- name: E3 · segmentation → tesseract → saknussemm (ministral-8b)
  description: Correction structurée intégrale, chaque ligne au modèle ministral-8b-latest (texte seul,
    comme E3 mistral-small).
  initial_inputs:
