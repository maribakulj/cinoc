name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Lint + type + tests, sur la matrice OS × Python à forte valeur.
  # Windows/macOS exercent le code de chemins (validated_path, stem injectif,
  # workspaces) — exactement ce qui casse hors Linux. make absent sous Windows
  # → on appelle ruff/mypy/pytest directement (portable).
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: pip install -e ".[dev]"
      # Sans `saknussemm`, les tests de la chaine de correction structuree se
      # SAUTENT, et la CI ne garantit rien sur la seule brique qui touche a la
      # mise en page. On l'installe a la version exacte figee dans
      # pyproject.toml. Une installation ratee bloque le gate : les tests du
      # pont ne doivent jamais passer par saut.
      - name: Install saknussemm (version exacte de pyproject.toml)
        run: pip install ".[saknussemm]"
      - name: Lint
        run: ruff check cinoc/ tests/
      - name: Type
        run: python -m mypy -p cinoc
      - name: Test
        env:
          # `coverage` via sys.monitoring (PEP 669) annule l'overhead de tracing
          # sur Python 3.12+ (≈ ×3 plus rapide, MÊME couverture mesurée → gate
          # intact). 3.11 garde le traceur C (`ctrace`).
          COVERAGE_CORE: ${{ matrix.python == '3.11' && 'ctrace' || 'sysmon' }}
          # L'installation a reussi -> le paquet DOIT etre importable. Sans ce
          # contrat, un extra renomme ou une dependance cassee ferait sauter les
          # tests de la chaine de correction exactement comme une panne
          # reseau : en silence, CI verte, brique non exercee.
          # (cf. tests/guardrails/test_optional_deps_really_installed.py)
          CINOC_REQUIRE_SAKNUSSEMM: "1"
        # Le gate (coverage + seuil 85 %) est injecté ICI, pas dans addopts —
        # ainsi les runs locaux restent rapides par défaut (cf. Makefile/pyproject).
        run: python -m pytest -q --cov=cinoc --cov-report=term-missing --cov-fail-under=85

  # Oracles externes EXÉCUTÉS (P5e 10, D-290) : dinglehopper (golden CER/WER
  # sur bnl_mini, parité de convention) et le paquet `roman` (numéraux). Les
  # tests marqués `oracle` ne tournent qu'ici ; ailleurs, faute du paquet, ils
  # sautent. Une seule version de Python : l'oracle juge le calcul, pas
  # l'interpréteur (la matrice `test` s'en charge).
  oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: |
          pip install -e ".[dev,oracle]"
          # dinglehopper déclare `ocrd>=3.3`, qui tire tout OCR-D : les deux en
          # --no-deps ; ce que leurs imports exigent vraiment est dans l'extra
          # `oracle` (pyproject.toml). Le golden écrit la version qui l'a
          # produit : changer celle-ci sans le régénérer fait échouer ce job.
          pip install --no-deps "dinglehopper==0.11.0" "ocrd==3.13.3"
      - name: Test (oracles seuls)
        env:
          # Installation réussie -> oracles importables, sinon échec nommé (et
          # non des tests sautés en silence, job vert sur rien).
          CINOC_REQUIRE_ORACLES: "1"
        run: python -m pytest -q -m oracle

  # Les SDK fournisseurs INSTALLÉS (reste de S22, D-294 ; S29a) : ailleurs,
  # `openai`, `anthropic` et `mistralai` sont absents — les adaptateurs sont
  # exercés sur de faux SDK, mypy ne voit pas leurs types, et les tests « vrais
  # SDK » (`importorskip`) sautent. Trois erreurs de typage et un import cassé
  # (listage Mistral sous 3.x) sont passés ainsi. Une seule version de Python,
  # comme `oracle` : on juge le contrat d'une majeure de SDK, pas l'interpréteur.
  sdks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        # `saknussemm` : sans lui, les tests de la correction structurée de
        # `tests/adapters` sautent ici aussi. `cryptography` : le serveur HTTPS
        # muet qui prouve qu'un arrêt coupe une lecture TLS (toute API cloud
        # est en HTTPS) — absent des autres jobs, ce test n'y tourne pas.
        run: pip install -e ".[dev,openai,anthropic,mistral,saknussemm]" cryptography
      - name: Type (vrais SDK)
        run: python -m mypy -p cinoc
      - name: Test (adaptateurs sous vrais SDK)
        env:
          # Installation réussie -> SDK importables, sinon échec nommé (et non
          # des tests « vrais SDK » sautés en silence, job vert sur rien).
          CINOC_REQUIRE_SDKS: "1"
        run: >-
          python -m pytest -q -n auto tests/adapters
          tests/app/test_models_real_sdk.py
          tests/guardrails/test_optional_deps_really_installed.py

  # Le paquet DISTRIBUÉ, pas l'environnement de dev : la roue construite,
  # installée sans aucun extra dans un venv vierge, lancée hors du dépôt. Le
  # job `test` installe toujours `[dev]`, qui tire des dépendances que la base
  # n'a pas : c'est ainsi que `cinoc --help` a planté en installation nue
  # pendant trois mois avec une CI verte (D-260).
  install-bare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # setuptools_scm calcule la version depuis l'historique
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # sdist puis roue construite **depuis le sdist** : c'est le chemin de la
      # publication, et il prouve que MANIFEST.in n'a rien retiré dont la roue
      # a besoin (gabarits, assets, pricing.json, YAML, prompts).
      - name: Construire le sdist et la roue
        run: |
          python -m pip install build twine
          python -m build --outdir "$RUNNER_TEMP/dist"
      # Publiable (P5d items 5-6, D-270) : métadonnées valides pour PyPI, sdist
      # sans les scans du dépôt, roue sans les notes de conception.
      - name: Vérifier le paquet publiable
        run: |
          python -m twine check --strict "$RUNNER_TEMP"/dist/*
          taille=$(stat -c %s "$RUNNER_TEMP"/dist/*.tar.gz)
          test "$taille" -lt 5000000 || { echo "::error::sdist de $taille octets (plafond : 5 Mo)"; exit 1; }
          python -c "import sys, zipfile; md = [n for n in zipfile.ZipFile(sys.argv[1]).namelist() if n.endswith('.md')]; sys.exit(f'.md dans la roue : {md}' if md else 0)" "$RUNNER_TEMP"/dist/*.whl
      - name: Installer sans extra et lancer hors du dépôt
        run: |
          python -m venv "$RUNNER_TEMP/bare"
          "$RUNNER_TEMP/bare/bin/pip" install "$RUNNER_TEMP"/dist/*.whl
          cp -r examples "$RUNNER_TEMP/examples"
          cd "$RUNNER_TEMP"
          bare/bin/cinoc --help
          bare/bin/cinoc --version
          bare/bin/cinoc list engines
          bare/bin/cinoc demo --output demo.html
          bare/bin/cinoc run examples/config.yaml -o run.html
          test -s demo.html && test -s run.html

  # Construit l'image de la vitrine (ce que le sandbox ne pouvait pas vérifier)
  # et la sonde RÉELLEMENT : conteneur lancé → /health via curl.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Préparer un rapport baké
        run: |
          mkdir -p deploy/reports
          # le .gitkeep suffit ; un rapport démo est déjà versionné dans deploy/reports.
      - name: Build de l'image
        run: docker build -f deploy/Dockerfile -t cinoc-vitrine:ci .
      - name: Lancer + sonder le conteneur
        run: |
          docker run -d --name vitrine -p 7860:7860 cinoc-vitrine:ci
          ok=0
          for _ in $(seq 1 40); do
            curl -sf http://127.0.0.1:7860/health >/dev/null 2>&1 && { ok=1; break; }
            sleep 1
          done
          docker logs vitrine || true
          docker rm -f vitrine >/dev/null 2>&1 || true
          test "$ok" = 1 || { echo "::error::le conteneur ne répond pas sur /health"; exit 1; }
          echo "image OK"

  # Scan de vulnérabilités des dépendances (appli exposée au web).
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: pip-audit (deps de la vitrine)
        run: |
          pip install pip-audit
          # On audite les requirements de la vitrine (surface servie), pas l'env
          # système (qui contient des paquets hors-PyPI comme python-apt).
          pip-audit --strict -r deploy/requirements.txt
