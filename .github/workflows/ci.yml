name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Lint + type + tests, sur la matrice OS × Python à forte valeur.
  # Windows/macOS exercent le code de chemins (validated_path, stem injectif,
  # workspaces) — exactement ce qui casse hors Linux. make absent sous Windows
  # → on appelle ruff/mypy/pytest directement (portable).
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: pip install -e ".[dev]"
      # `saknussemm` n'est pas publie : sans lui, les tests de la chaine de
      # correction structuree se SAUTENT, et la CI ne garantit rien sur la
      # seule brique qui touche a la mise en page. On l'installe donc depuis le
      # depot. `continue-on-error` a dessein : une panne reseau ou un depot
      # momentanement injoignable ne doit pas rendre la CI rouge sur du code
      # qui n'a pas change — les tests se sauteront alors, comme avant.
      - name: Install saknussemm (non publie — depuis le depot)
        id: saknussemm
        continue-on-error: true
        run: pip install ".[saknussemm]"
      - name: Lint
        run: ruff check cinoc/ tests/
      - name: Type
        run: python -m mypy -p cinoc
      - name: Test
        env:
          # `coverage` via sys.monitoring (PEP 669) annule l'overhead de tracing
          # sur Python 3.12+ (≈ ×3 plus rapide, MÊME couverture mesurée → gate
          # intact). 3.11 garde le traceur C (`ctrace`).
          COVERAGE_CORE: ${{ matrix.python == '3.11' && 'ctrace' || 'sysmon' }}
          # L'installation a reussi -> le paquet DOIT etre importable. Sans ce
          # contrat, un extra renomme ou une dependance cassee ferait sauter les
          # tests de la chaine de correction exactement comme une panne
          # reseau : en silence, CI verte, brique non exercee.
          # (cf. tests/guardrails/test_optional_deps_really_installed.py)
          CINOC_REQUIRE_SAKNUSSEMM: ${{ steps.saknussemm.outcome == 'success' && '1' || '' }}
        # Le gate (coverage + seuil 85 %) est injecté ICI, pas dans addopts —
        # ainsi les runs locaux restent rapides par défaut (cf. Makefile/pyproject).
        run: python -m pytest -q --cov=cinoc --cov-report=term-missing --cov-fail-under=85

  # Construit l'image de la vitrine (ce que le sandbox ne pouvait pas vérifier)
  # et la sonde RÉELLEMENT : conteneur lancé → /health via curl.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Préparer un rapport baké
        run: |
          mkdir -p deploy/reports
          # le .gitkeep suffit ; un rapport démo est déjà versionné dans deploy/reports.
      - name: Build de l'image
        run: docker build -f deploy/Dockerfile -t cinoc-vitrine:ci .
      - name: Lancer + sonder le conteneur
        run: |
          docker run -d --name vitrine -p 7860:7860 cinoc-vitrine:ci
          ok=0
          for _ in $(seq 1 40); do
            curl -sf http://127.0.0.1:7860/health >/dev/null 2>&1 && { ok=1; break; }
            sleep 1
          done
          docker logs vitrine || true
          docker rm -f vitrine >/dev/null 2>&1 || true
          test "$ok" = 1 || { echo "::error::le conteneur ne répond pas sur /health"; exit 1; }
          echo "image OK"

  # Scan de vulnérabilités des dépendances (appli exposée au web).
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: pip-audit (deps de la vitrine)
        run: |
          pip install pip-audit
          # On audite les requirements de la vitrine (surface servie), pas l'env
          # système (qui contient des paquets hors-PyPI comme python-apt).
          pip-audit --strict -r deploy/requirements.txt
